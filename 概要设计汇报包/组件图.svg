<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#526777" stroke-width="1.5"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#193747}.small{font-size:18px}.edge{fill:none;stroke:#526777;stroke-width:2}</style><rect width="1600" height="1150" fill="#f6f9fb"/><text x="45" y="55" font-size="32">01  组件图：分层结构与业务职责</text><text x="45" y="92" font-size="19">依据系统设计方案 V1.0 第2节重绘 · 逻辑组件，不表示独立部署的微服务</text><rect x="45" y="135" width="390" height="140" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="61" y="158" font-size="16">«component» Vue 3 / TypeScript</text><text x="61" y="183" font-size="23">学生端 / 管理端</text><path d="M45 201h390" stroke="#16776b"/><text x="61" y="229" font-size="19">查询、预约、签到、记录</text><text x="61" y="258" font-size="19">场地维护、人工签到、复核、统计</text><rect x="580" y="135" width="440" height="140" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="596" y="158" font-size="16">«component» Spring MVC</text><text x="596" y="183" font-size="23">API 控制器</text><path d="M580 201h440" stroke="#16776b"/><text x="596" y="229" font-size="19">参数校验、资源归属检查</text><text x="596" y="258" font-size="19">调用业务服务、返回统一响应</text><rect x="1160" y="135" width="395" height="140" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="1176" y="158" font-size="16">«component»</text><text x="1176" y="183" font-size="23">身份与权限</text><path d="M1160 201h395" stroke="#16776b"/><text x="1176" y="229" font-size="19">登录、令牌验证、角色授权</text><text x="1176" y="258" font-size="19">Spring Security / JWT</text><path class="edge" d="M435 220 L580 220" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="449" y="202" font-size="18">REST API</text><path class="edge" d="M1020 220 L1160 220" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1032" y="201" font-size="18">使用鉴权</text><rect x="35" y="380" width="1530" height="365" rx="10" fill="#eaf4f1" stroke="#8db6ae" stroke-dasharray="6 4"/><text x="55" y="410" font-size="21">业务服务层  ·  Spring Boot 3  ·  由服务管理事务</text><path class="edge" d="M800 275 L800 380" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="820" y="345" font-size="18">调用对应业务接口</text><rect x="55" y="435" width="480" height="140" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="71" y="458" font-size="16">«component»</text><text x="71" y="483" font-size="23">场地与座位</text><path d="M55 501h480" stroke="#16776b"/><text x="71" y="529" font-size="19">楼栋、房间、座位、开放规则</text><text x="71" y="558" font-size="19">维护签到码；查询可用性</text><rect x="560" y="435" width="480" height="140" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="576" y="458" font-size="16">«component»</text><text x="576" y="483" font-size="23">预约</text><path d="M560 501h480" stroke="#16776b"/><text x="576" y="529" font-size="19">资格与冲突检查、创建、取消</text><text x="576" y="558" font-size="19">用户行 → 座位行锁定协议</text><rect x="1065" y="435" width="480" height="140" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="1081" y="458" font-size="16">«component»</text><text x="1081" y="483" font-size="23">履约</text><path d="M1065 501h480" stroke="#16776b"/><text x="1081" y="529" font-size="19">签到、签退、人工确认</text><text x="1081" y="558" font-size="19">超时处理、生成违约候选</text><rect x="55" y="610" width="480" height="111" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="71" y="633" font-size="16">«component»</text><text x="71" y="658" font-size="23">违约与申诉</text><path d="M55 676h480" stroke="#16776b"/><text x="71" y="704" font-size="19">候选、申诉、复核、资格计算</text><rect x="560" y="610" width="480" height="111" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="576" y="633" font-size="16">«component»</text><text x="576" y="658" font-size="23">统计</text><path d="M560 676h480" stroke="#16776b"/><text x="576" y="704" font-size="19">只读汇总预约、签到及场地数据</text><rect x="1065" y="610" width="480" height="111" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="1081" y="633" font-size="16">«component»</text><text x="1081" y="658" font-size="23">审计</text><path d="M1065 676h480" stroke="#16776b"/><text x="1081" y="704" font-size="19">保存关键操作人、时间和结果</text><rect x="470" y="820" width="660" height="111" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="486" y="843" font-size="16">«component»</text><text x="486" y="868" font-size="23">Mapper 数据访问组件</text><path d="M470 886h660" stroke="#16776b"/><text x="486" y="914" font-size="19">MyBatis-Plus：查询、条件更新、锁定查询</text><path class="edge" d="M800 745 L800 820" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="825" y="790" font-size="18">各业务服务按职责访问</text><rect x="470" y="1000" width="660" height="64" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="486" y="1031" font-size="23">MySQL 8  业务表与审计记录</text><path d="M470 1048h660" stroke="#16776b"/><path class="edge" d="M800 931 L800 1000" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="825" y="986" font-size="18">SQL</text><text x="45" y="1085" font-size="18">虚线箭头：调用者依赖提供者。层内协作见“服务协作类图”；认证在受保护业务执行前完成。</text><text x="45" y="1112" font-size="18">Nginx 提供静态资源与 HTTPS 反向代理；每分钟定时任务调用 CheckInService.expireDue()。</text></svg>