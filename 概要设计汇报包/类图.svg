<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#526777" stroke-width="1.5"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#193747}.small{font-size:18px}.edge{fill:none;stroke:#526777;stroke-width:2}</style><rect width="1600" height="1220" fill="#f6f9fb"/><text x="45" y="55" font-size="32">02  核心领域类图：以预约为中心组织业务数据</text><text x="45" y="92" font-size="19">属性按系统设计方案第4节整理 · 为保持可读性省略部分字段、辅助实体和外键属性</text><rect x="45" y="140" width="420" height="180" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="61" y="171" font-size="23">StudyRoom 自习室</text><path d="M45 188h420" stroke="#16776b"/><text x="61" y="216" font-size="19">- id: Long</text><text x="61" y="245" font-size="19">- buildingId: Long</text><text x="61" y="274" font-size="19">- name: String</text><text x="61" y="303" font-size="19">- status: String</text><rect x="590" y="140" width="420" height="180" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="606" y="171" font-size="23">Seat 座位</text><path d="M590 188h420" stroke="#16776b"/><text x="606" y="216" font-size="19">- id: Long</text><text x="606" y="245" font-size="19">- seatNo: String</text><text x="606" y="274" font-size="19">- attributes: String</text><text x="606" y="303" font-size="19">- status: String</text><rect x="1135" y="140" width="420" height="180" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="1151" y="171" font-size="23">User 用户</text><path d="M1135 188h420" stroke="#16776b"/><text x="1151" y="216" font-size="19">- id: Long</text><text x="1151" y="245" font-size="19">- account: String</text><text x="1151" y="274" font-size="19">- passwordHash: String</text><text x="1151" y="303" font-size="19">- role / status: String</text><rect x="45" y="470" width="420" height="180" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="61" y="501" font-size="23">OpeningRule 开放规则</text><path d="M45 518h420" stroke="#16776b"/><text x="61" y="546" font-size="19">- id: Long</text><text x="61" y="575" font-size="19">- weekday: Integer</text><text x="61" y="604" font-size="19">- startTime / endTime: Time</text><text x="61" y="633" font-size="19">- effectiveFrom / To: Date</text><rect x="590" y="470" width="420" height="180" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="606" y="501" font-size="23">Reservation 预约</text><path d="M590 518h420" stroke="#16776b"/><text x="606" y="546" font-size="19">- id: Long</text><text x="606" y="575" font-size="19">- reservationNo: String</text><text x="606" y="604" font-size="19">- startAt / endAt: DateTime</text><text x="606" y="633" font-size="19">- status: String</text><rect x="45" y="850" width="420" height="180" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="61" y="881" font-size="23">CheckIn 签到记录</text><path d="M45 898h420" stroke="#16776b"/><text x="61" y="926" font-size="19">- id: Long</text><text x="61" y="955" font-size="19">- checkedInAt: DateTime</text><text x="61" y="984" font-size="19">- checkedOutAt: DateTime [0..1]</text><text x="61" y="1013" font-size="19">- method: String</text><rect x="590" y="850" width="420" height="180" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="606" y="881" font-size="23">Violation 违约记录</text><path d="M590 898h420" stroke="#16776b"/><text x="606" y="926" font-size="19">- id: Long</text><text x="606" y="955" font-size="19">- occurredAt: DateTime</text><text x="606" y="984" font-size="19">- status: String</text><text x="606" y="1013" font-size="19">- appealText: String [0..1]</text><rect x="1135" y="850" width="420" height="180" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="1151" y="881" font-size="23">ViolationEvent 处理事件</text><path d="M1135 898h420" stroke="#16776b"/><text x="1151" y="926" font-size="19">- id: Long</text><text x="1151" y="955" font-size="19">- action: String</text><text x="1151" y="984" font-size="19">- operatorId: Long</text><text x="1151" y="1013" font-size="19">- reason / createdAt</text><path class="edge" d="M465 235 L590 235"/><text x="478" y="220" font-size="18">1</text><text x="540" y="220" font-size="18">0..*</text><path class="edge" d="M255 320 L255 470"/><text x="269" y="347" font-size="18">1</text><text x="269" y="454" font-size="18">0..*</text><text x="275" y="402" font-size="18">配置</text><path class="edge" d="M800 320 L800 470"/><text x="815" y="347" font-size="18">1</text><text x="815" y="454" font-size="18">0..*</text><text x="825" y="402" font-size="18">关联预约</text><path class="edge" d="M1345 320 L1345 550 L1010 550"/><text x="1360" y="348" font-size="18">1</text><text x="1026" y="534" font-size="18">0..*</text><text x="1150" y="532" font-size="18">发起</text><path class="edge" d="M590 580 L520 580 L520 790 L255 790 L255 850"/><text x="556" y="565" font-size="18">1</text><text x="270" y="837" font-size="18">0..1</text><text x="315" y="775" font-size="18">签到结果</text><path class="edge" d="M800 650 L800 850"/><text x="815" y="679" font-size="18">1</text><text x="815" y="833" font-size="18">0..1</text><text x="825" y="748" font-size="18">违约候选</text><path class="edge" d="M1010 945 L1135 945"/><text x="1022" y="930" font-size="18">1</text><text x="1082" y="930" font-size="18">0..*</text><text x="45" y="1155" font-size="18">实线为普通关联；数量标在各端：每条预约属于1个用户和1个座位，最多1条签到与1条违约记录。</text><text x="45" y="1182" font-size="18">CheckIn.reservationId 与 Violation.reservationId 均唯一；处理历史写入 ViolationEvent。</text><text x="45" y="1209" font-size="18">本图非完整数据库图：Building、CheckInCode、AuditLog 等辅助实体省略；字段类型为汇报简写。</text></svg>