<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#526777" stroke-width="1.5"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#193747}.small{font-size:18px}.edge{fill:none;stroke:#526777;stroke-width:2}</style><rect width="1600" height="1120" fill="#f6f9fb"/><text x="45" y="55" font-size="32">03  服务协作类图：业务规则由服务组织</text><text x="45" y="92" font-size="19">补充页 · 方法名沿用系统设计方案第4.3节 · 虚线箭头表示使用依赖</text><rect x="45" y="160" width="460" height="169" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="61" y="183" font-size="16">«service»</text><text x="61" y="208" font-size="23">ReservationService</text><path d="M45 226h460" stroke="#16776b"/><text x="61" y="254" font-size="19">+ create(request)</text><text x="61" y="283" font-size="19">+ cancel(id)</text><text x="61" y="312" font-size="19">+ findAvailable(query)</text><rect x="600" y="160" width="430" height="140" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="616" y="183" font-size="16">«service»</text><text x="616" y="208" font-size="23">RoomService</text><path d="M600 226h430" stroke="#16776b"/><text x="616" y="254" font-size="19">场地与开放规则维护</text><text x="616" y="283" font-size="19">提供场地查询与规则校验</text><rect x="1120" y="160" width="435" height="140" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="1136" y="183" font-size="16">«service»</text><text x="1136" y="208" font-size="23">StatisticsService</text><path d="M1120 226h435" stroke="#16776b"/><text x="1136" y="254" font-size="19">只读聚合预约与履约数据</text><text x="1136" y="283" font-size="19">统计口径按设计方案第3.4节</text><rect x="45" y="540" width="460" height="198" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="61" y="563" font-size="16">«service»</text><text x="61" y="588" font-size="23">CheckInService</text><path d="M45 606h460" stroke="#16776b"/><text x="61" y="634" font-size="19">+ checkIn(id, code)</text><text x="61" y="663" font-size="19">+ checkOut(id)</text><text x="61" y="692" font-size="19">+ confirmManually(id, reason)</text><text x="61" y="721" font-size="19">+ expireDue()</text><rect x="600" y="540" width="430" height="198" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="616" y="563" font-size="16">«service»</text><text x="616" y="588" font-size="23">ViolationService</text><path d="M600 606h430" stroke="#16776b"/><text x="616" y="634" font-size="19">+ createCandidate(reservationId)</text><text x="616" y="663" font-size="19">+ appeal(id, text)</text><text x="616" y="692" font-size="19">+ review(id, decision, reason)</text><text x="616" y="721" font-size="19">+ canReserve(userId)</text><path class="edge" d="M505 245 L600 245" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="515" y="225" font-size="18">场地</text><path class="edge" d="M275 540 L275 329" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="293" y="438" font-size="18">读取 / 更新预约</text><path class="edge" d="M505 650 L600 650" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="515" y="630" font-size="18">违约</text><path class="edge" d="M480 329 L480 435 L810 435 L810 540" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="550" y="416" font-size="18">预约资格查询</text><rect x="1120" y="540" width="435" height="140" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="1136" y="563" font-size="16">«service»</text><text x="1136" y="588" font-size="23">审计服务</text><path d="M1120 606h435" stroke="#16776b"/><text x="1136" y="634" font-size="19">管理操作记录操作者与原因</text><text x="1136" y="663" font-size="19">保留处理结果和时间</text><path class="edge" d="M1030 650 L1120 650" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1038" y="630" font-size="18">审计</text><rect x="370" y="910" width="860" height="111" rx="7" fill="white" stroke="#16776b" stroke-width="2"/><text x="386" y="933" font-size="16">«persistence»</text><text x="386" y="958" font-size="23">Repository / Mapper</text><path d="M370 976h860" stroke="#16776b"/><text x="386" y="1004" font-size="19">业务服务按职责读写实体与锁定查询；不承载角色判断</text><text x="55" y="850" font-size="20">持久化依赖统一说明：各服务 → 对应 Mapper → MySQL；为避免交叉线，未逐一展开。</text><text x="45" y="1055" font-size="18">RoomService 与 StatisticsService 的方法签名原文未列出，本图只标职责；审计服务名称亦为职责标识。</text><text x="45" y="1082" font-size="18">实体保存数据；服务完成权限后的业务校验、事务及协作。依赖不代表异步消息或调用时序。</text></svg>