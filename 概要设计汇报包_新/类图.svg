<g data-note="constraints">
<path d="M1840 1080 H2512 L2540 1108 V1460 H1840 Z M2512 1080 V1108 H2540" fill="#edf4f6" stroke="#b8cbd1" stroke-width="2"/>
<path d="M1650,1200 L1740,1200 L1740,1240 L1840,1240" fill="none" stroke="#526777" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1865" y="1121" font-size="28" text-anchor="start" fill="#193747" font-weight="600">业务约束</text>
<text x="1865" y="1166" font-size="24" text-anchor="start" fill="#193747" font-weight="400">{ startAt &lt; endAt }</text>
<text x="1865" y="1205" font-size="24" text-anchor="start" fill="#193747" font-weight="400">取消：待签到，且开始前严格大于30分钟。</text>
<text x="1865" y="1244" font-size="24" text-anchor="start" fill="#193747" font-weight="400">签到窗口：[开始，开始＋15分钟)。</text>
<text x="1865" y="1283" font-size="24" text-anchor="start" fill="#193747" font-weight="400">预约最多一条签到记录和一条违约记录。</text>
<text x="1865" y="1322" font-size="24" text-anchor="start" fill="#193747" font-weight="400">复核不恢复预约终态；处理历史保留。</text>
<text x="1865" y="1361" font-size="24" text-anchor="start" fill="#193747" font-weight="400">事件只提供读取操作，不提供历史修改操作。</text>
<text x="1865" y="1400" font-size="24" text-anchor="start" fill="#193747" font-weight="400">对象状态变更仍须经过权限与事务校验。</text>
</g>
<text x="50" y="2203" font-size="25" text-anchor="start" fill="#193747" font-weight="400">− 私有属性；+ 公开操作；操作格式：名称(参数名: 类型): 返回类型。实线表示普通关联，两端标明多重性。</text>
<text x="50" y="2247" font-size="25" text-anchor="start" fill="#526777" font-weight="400">类型采用 Java 表达；[0..1] 表示可缺省。新增操作为设计补充；跨对象校验、锁与持久化事务仍由业务处理协调。</text>
<text x="50" y="2291" font-size="25" text-anchor="start" fill="#526777" font-weight="400">仅展示核心属性、操作与关联；省略辅助实体和部分外键。座位及自习室的启用状态不等同于时段空闲。</text>
</svg>