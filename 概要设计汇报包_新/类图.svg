<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2320" viewBox="0 0 2600 2320" role="img" aria-labelledby="title desc">
<title id="title">校园自习室预约管理系统：核心类图（含方法）</title>
<desc id="desc">依据课程第五章第58、65、68至70页以及项目设计文档第3、4节补充实体操作。canCancel检查待签到状态且开始前严格大于30分钟；canCheckIn检查待签到状态以及开始后15分钟内的半开时间窗口；startUse与cancel复用相应条件，markNoShow仅适用于已过截止的待签到预约。complete仅允许使用中到已完成。overlaps采用左闭右开时段，不自行替代有效预约筛选。review修改违约处理状态并生成处理事件，不恢复预约终态。方法是本次补充的实体设计，不是已实现代码。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style>
