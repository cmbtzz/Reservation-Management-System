<text x="50" y="60" font-size="39" text-anchor="start" fill="#193747" font-weight="600">核心类图 · 属性、方法与关联</text>
<text x="50" y="107" font-size="25" text-anchor="start" fill="#526777" font-weight="400">每个类按“类名—属性—操作”分区；方法根据预约、履约与违约业务规则补充。</text>
