<text x="1410.0" y="245" font-size="21" text-anchor="middle" fill="#52727e" font-weight="400">预约服务</text>
<path d="M1030,262 L1790,262" fill="none" stroke="#526777" stroke-width="2.4"/>
<text x="1049" y="295" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ create(request: ReservationRequest): Reservation</text>
<text x="1049" y="329" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ cancel(id: Long): Reservation</text>
<text x="1049" y="363" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ findAvailable(query: AvailabilityQuery): Seat [0..*]</text>
<text x="1049" y="397" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ getById(id: Long): Reservation [0..1]</text>
<text x="1049" y="431" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ findOverlapping(query: ReservationQuery): Reservation [0..*]</text>
<text x="1049" y="465" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ findExpired(deadline: LocalDateTime): Reservation [0..*]</text>
<text x="1049" y="499" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ updateStatus(change: ReservationStateChange): Boolean</text>
</g>
