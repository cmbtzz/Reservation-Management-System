<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1780" viewBox="0 0 2800 1780" role="img" aria-labelledby="diagram-title">
<title id="diagram-title">03  服务协作类图 · 操作签名与使用依赖</title>
<defs><marker id="dependency" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#526777" stroke-width="2"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style>
<rect x="0" y="0" width="2800" height="1780" fill="#f6f9fb" stroke="none" stroke-width="2"/>
<text x="45" y="56" font-size="36" text-anchor="start" fill="#193747" font-weight="600">03  服务协作类图 · 操作签名与使用依赖</text>
<text x="45" y="99" font-size="23" text-anchor="start" fill="#526777" font-weight="400">沿用原服务职责与已有方法名；补充协作所需操作、参数类型和返回类型。类框省略属性分区，展示公开操作。</text>
<g data-class="RoomService">
<rect x="60" y="180" width="720" height="310" fill="white" stroke="#16776b" stroke-width="2"/>
<text x="420.0" y="215" font-size="29" text-anchor="middle" fill="#193747" font-weight="600">RoomService</text>
<text x="420.0" y="245" font-size="21" text-anchor="middle" fill="#52727e" font-weight="400">场地与座位服务</text>
<path d="M60,262 L780,262" fill="none" stroke="#526777" stroke-width="2.4"/>
<text x="79" y="295" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ getSeat(seatId: Long): Seat [0..1]</text>
<text x="79" y="329" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ getRules(seatId: Long): OpeningRule [0..*]</text>
<text x="79" y="363" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ updateRoom(change: RoomChange): StudyRoom</text>
<text x="79" y="397" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ updateSeat(change: SeatChange): Seat</text>
<text x="79" y="431" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ setOpeningRules(change: OpeningRuleChange): void</text>
<text x="79" y="465" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ setCheckInCode(change: CheckInCodeChange): void</text>
</g>
<g data-class="ReservationService">
