<text x="1073" y="1207" font-size="23" text-anchor="start" fill="#193747" font-weight="400">reason: String): Violation</text>
<text x="1049" y="1241" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ canReserve(userId: Long): Boolean</text>
</g>
<g data-class="AuditService">
<rect x="2020" y="990" width="720" height="140" fill="white" stroke="#16776b" stroke-width="2"/>
