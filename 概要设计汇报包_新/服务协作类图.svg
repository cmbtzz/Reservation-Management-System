<text x="2039" y="363" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ confirmManually(id: Long, reason: String): CheckIn</text>
<text x="2039" y="397" font-size="23" text-anchor="start" fill="#193747" font-weight="400">+ expireDue(): Integer</text>
